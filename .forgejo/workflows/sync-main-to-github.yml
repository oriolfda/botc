name: Sync Forgejo main to GitHub main

on:
  push:
    branches:
      - main

jobs:
  sync-main:
    runs-on: docker
    steps:
      - name: Checkout Forgejo main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure GitHub SSH access
        env:
          BOTC_MAIN_SSH_KEY: ${{ secrets.BOTC_MAIN_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BOTC_MAIN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push only main to GitHub
        run: |
          set -eu
          git remote add github git@github.com:oriolfda/botc.git
          git push github HEAD:refs/heads/main
