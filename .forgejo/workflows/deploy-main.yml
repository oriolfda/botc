name: Deploy Main to P01

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: docker

    steps:
      - name: Prepare SSH
        shell: bash
        env:
          P01_DEPLOY_KEY: ${{ secrets.P01_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$P01_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '192.168.0.230 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAZ+vQ7lHCG/EP9mXmnVuvbbjCdFzUZMCqTW0l65z5ur' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy BOTC Main
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            root@192.168.0.230 deploy
