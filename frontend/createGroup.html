<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gestió de Grups</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#121212;color:#f0f0f0;padding:12px}
h2{color:#2e8b57;margin-bottom:12px;text-align:center}
.form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
input{padding:10px;border-radius:6px;border:1px solid #444;background:#222;color:#fff}
button{padding:10px 14px;border:none;border-radius:6px;cursor:pointer}
button.add{background:#2e8b57;color:#fff}
button.cancel{background:#666;color:#fff;display:none}
.list{display:flex;flex-direction:column;gap:8px;max-width:800px;margin:auto}
.card{background:#2d2d2d;padding:10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.actions{display:flex;gap:8px}
.editBtn,.deleteBtn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;border:none;cursor:pointer;color:#fff;font-size:18px}
.editBtn{background:#3a86ff}
.deleteBtn{background:#dc3545}
.deleteBtn svg{width:16px;height:16px;fill:white}
.status{min-height:20px;text-align:center;margin:-4px 0 10px;color:#ff8a80}
</style>
<script src="env.js"></script>
</head>
<body>
<h2>Gestió de Grups</h2>
<div class="form">
  <input id="gName" placeholder="Nom del grup">
  <input id="codeUsr" placeholder="Codi Usuari">
  <input id="codeAdm" placeholder="Codi Admin">
  <button class="add" id="addBtn">Afegir Grup</button>
  <button class="cancel" id="cancelBtn">Cancel·lar</button>
</div>
<div class="status" id="status"></div>
<div class="list" id="list"></div>

<script>
const BOTC_CONFIG = window.BOTC_CONFIG || {};
const urlEnv = new URLSearchParams(window.location.search).get("env");
const ENV = (urlEnv || BOTC_CONFIG.ENV || "AUTO").toUpperCase();

function resolveApiBase(){
  if (BOTC_CONFIG.API_BASE) {
    return { base: BOTC_CONFIG.API_BASE, prefix: BOTC_CONFIG.API_PREFIX ?? "" };
  }
  return { base: window.location.origin, prefix: "/api" };
}

const { base: API_BASE, prefix: API_PREFIX } = resolveApiBase();
const nameInput=document.getElementById('gName');
const usrInput=document.getElementById('codeUsr');
const admInput=document.getElementById('codeAdm');
const addBtn=document.getElementById('addBtn');
const cancelBtn=document.getElementById('cancelBtn');
const statusEl=document.getElementById('status');
let editingId=null;

function deleteSvg(){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="white" d="M432 32H312l-9.4-18.7A24 24 0 0 0 281.1 0H166.9a24 24 0 0 0-21.5 13.3L136 32H16A16 16 0 0 0 0 48v32a16 16 0 0 0 16 16h416a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16zM53.2 467a48 48 0 0 0 47.9 45h246.6a48 48 0 0 0 47.9-45L416 128H32l21.2 339z"/></svg>`;}

function clearForm(){
  editingId=null;
  nameInput.value=usrInput.value=admInput.value='';
  addBtn.textContent='Afegir Grup';
  cancelBtn.style.display='none';
  statusEl.textContent='';
}

function startEdit(g){
  editingId=g.id;
  nameInput.value=g.name || '';
  usrInput.value=g.codeUsr || '';
  admInput.value=g.codeAdm || '';
  addBtn.textContent='Desar canvis';
  cancelBtn.style.display='inline-block';
  statusEl.textContent='';
  nameInput.focus();
}

async function loadGroups(){
  const list=document.getElementById('list');
  try{
    const res=await fetch(`${API_BASE}${API_PREFIX}/groups`);
    if(!res.ok) return list.textContent='Error carregant grups';
    const groups=await res.json();
    list.innerHTML='';
    groups.forEach(g=>{
      const d=document.createElement('div');d.className='card';
      const info=document.createElement('div');
      const strong=document.createElement('strong');strong.textContent=g.name;
      const small=document.createElement('small');small.style.color='#aaa';small.textContent=` (${g.codeUsr||'-'}/${g.codeAdm||'-'})`;
      info.append(strong,small);

      const actions=document.createElement('div');actions.className='actions';
      const edit=document.createElement('button');edit.className='editBtn';edit.title='Editar grup';edit.textContent='✎';edit.onclick=()=>startEdit(g);
      const del=document.createElement('button');del.className='deleteBtn';del.title='Eliminar grup';del.innerHTML=deleteSvg();
      del.onclick=async()=>{
        if(!confirm(`Eliminar el grup "${g.name}"?`)) return;
        const response=await fetch(`${API_BASE}${API_PREFIX}/groups/${g.id}`,{method:'DELETE'});
        if(!response.ok){statusEl.textContent='No s’ha pogut eliminar el grup.';return;}
        if(editingId===g.id) clearForm();
        loadGroups();
      };
      actions.append(edit,del);d.append(info,actions);list.appendChild(d);
    });
    if(groups.length===0) list.textContent='No hi ha grups';
  }catch(e){list.textContent='Error carregant';}
}

addBtn.addEventListener('click',async()=>{
  const name=nameInput.value.trim();
  const usr=usrInput.value.trim();
  const adm=admInput.value.trim();
  if(!name){statusEl.textContent='El nom del grup és obligatori.';nameInput.focus();return;}

  const fd=new FormData();
  fd.append('name',name);
  fd.append('codeUsr',usr);
  fd.append('codeAdm',adm);

  const editing=editingId!==null;
  const url=editing ? `${API_BASE}${API_PREFIX}/groups/${editingId}` : `${API_BASE}${API_PREFIX}/groups`;
  const res=await fetch(url,{method:editing?'PUT':'POST',body:fd});
  if(!res.ok){statusEl.textContent=editing?'No s’han pogut desar els canvis.':'No s’ha pogut crear el grup.';return;}
  clearForm();
  loadGroups();
});

cancelBtn.addEventListener('click',clearForm);
loadGroups();
</script>
</body>
</html>
